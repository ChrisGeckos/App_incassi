<script>

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

S.events.forEach(e=>{if(e.f0){e.f=e.f0;delete e.f0}if(e.arch){const y=new Date(e.date).getFullYear();let f=S.fld.find(x=>x.g===e.g&&x.year===y);if(!f){f={id:id(),g:e.g,year:y,name:'Archivio '+y};S.fld.push(f)}e.f=f.id;delete e.arch}if(e.f&&!S.fld.some(f=>f.id===e.f))delete e.f})}
mig();
let view={n:'list'};
const cur=()=>S.events.find(e=>e.id===view.id);

const tot=(e,t)=>e.moves.filter(m=>m.t===t).reduce((s,m)=>s+m.a,0);

function calc(s){s=s.replace(/\s/g,'').replace(/[×xX*]/g,'*').replace(/[÷:\/]/g,'/').replace(/−/g,'-').replace(/,/g,'.');if(!s)return null;let i=0;
const num=()=>{if(s[i]==='-'){i++;return -num()}if(s[i]==='+'){i++;return num()}if(s[i]==='('){i++;const v=ex();if(s[i]!==')')throw 0;i++;return v}const m=/^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
const tm=()=>{let v=num();while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=num();if(o==='/'&&!r)throw 0;v=o==='*'?v*r:v/r}return v};
const ex=()=>{let v=tm();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=tm();v=o==='+'?v+r:v-r}return v};
try{const v=ex();return i===s.length&&isFinite(v)?v:null}catch(e){return null}}

function modal(h,t){$('#modal').innerHTML=`<div class="ov${t?' '+t:''}" onclick="if(event.target===this)closeM()"><div class="sh">${h}</div></div>`;kb();sync()}

function render(){const a=$('#app');a.innerHTML={list:listH5,ev:evH2,sum:sumH3,cat:catH,gr:grH3,fo:foH,set:setH}[view.n]();sync()}
const go=n=>{view.n=n;render()};

function listH(){const ev=[...S.events].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);

const nS=(v,k)=>`<td class="n ${k}">${eur(v)}</td>`,sgn=(t,v)=>(t==='in'?'+':'−')+eur(v);

const cn=String(r[h.c]??'').trim();let c=null;if(cn){let k=S.cats.find(x=>x.name.toLowerCase()===cn.toLowerCase());if(!k){k={id:id(),name:cn};S.cats.push(k)}c=k.id}
e.moves.push({id:id(),t,a:Math.round(Math.abs(a)*100)/100,d:String(r[h.s]??'').trim()||(t==='in'?'Ricevuto':'Pagato'),c,ts:pdate(r[h.d]).toISOString()});n++}
save();closeM();render();toast(n+' voci importate')}catch(x){toast('File non leggibile')}}

function evH(){const e=cur(),dis=e.closed?'disabled':'';
const ms=[...e.moves].sort((a,b)=>b.ts.localeCompare(a.ts)||b.id-a.id);let b=0;const run={};
[...e.moves].sort((a,b)=>a.ts.localeCompare(b.ts)||a.id-b.id).forEach(m=>{b+=m.t==='in'?m.a:-m.a;run[m.id]=b});
const i=tot(e,'in'),o=tot(e,'out'),r=i-o,cell=(l,v,c)=>`<div><small>${l}</small><b style="color:var(--${c});font-weight:${c==='gr'?800:600}">${eur(v)}</b></div>`;
return `<header><button class="ic" onclick="goBack()">‹</button><h1 onclick="ren(${e.id})">${esc(e.name)} ✎</h1><button class="ic" onclick="go('sum')">📊</button><button class="ic" onclick="toggle()">${e.closed?'🔒':'🔓'}</button></header><main style="${tint(e.color,'--bg')}">${ms.length?ms.map(m=>`<div class="card" ${e.closed?'':`data-lp="m,${m.id}" onclick="mov('${m.t}',${m.id})"`} style="border-left:6px solid var(--${m.t});background:color-mix(in srgb,var(--${m.t}) 7%,var(--card))"><div><b>${esc(m.d)}</b><small>${catName(m.c)?esc(catName(m.c))+' · ':''}${fmt(m.ts)}</small></div>${m.f?`<button class="ic" onclick="event.stopPropagation();vp(${m.id})">📷</button>`:''}<div class="r"><b style="color:var(--${m.t})">${eur(m.a)}</b><small>Bilancio ${eur(run[m.id])}</small></div></div>`).join(''):'<p class="empty">Nessun movimento.<br>Usa i pulsanti in basso.</p>'}</main><footer><div class="two"><button class="btn in" ${dis} onclick="mov('in')">Hai Ricevuto</button><button class="btn out" ${dis} onclick="mov('out')">Hai Pagato</button></div><div class="tots">${cell('Totale Ricevuto',i,'yel')}${cell('Totale Pagato',o,'out')}${cell('Ricavo',r,r>=0?'gr':'out')}</div></footer>`}
function toggle(){const e=cur();e.closed=!e.closed;save();view.n=e.closed?'sum':'ev';render()}

const catOpts=s=>`<option value="">Nessuna categoria</option>`+S.cats.map(c=>`<option value="${c.id}" ${c.id===s?'selected':''}>${esc(c.name)}</option>`).join('');
const MES=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
function mov(t,mid){const e=cur(),m=mid?e.moves.find(x=>x.id===mid):null,L0=loc(m?m.ts:new Date()),ttl=m?'Modifica voce':t==='in'?'Hai Ricevuto':'Hai Pagato';
modal(`<div id="pg" class="pg ${t}"><div class="fh"><button class="ic" onclick="closeM()">←</button><h2 id="pv" data-t="${ttl}">${ttl}</h2><button class="hs" onclick="saveMov(curT,${mid||0})">Salva</button></div><div class="sc2"><div class="fc"><div class="pills"><button id="pi" class="pill${t==='in'?' on':''}" onclick="swType('in')">Hai Ricevuto</button><button id="po" class="pill${t==='out'?' on':''}" onclick="swType('out')">Hai Pagato</button></div><div class="dtrow"><div class="dtf" style="flex:1.7"><button class="ar" onclick="dtShift(-1)">‹</button><label class="dtl"><span id="dds"></span><input id="dd" type="date" value="${L0.slice(0,10)}" onchange="dtCh(1)"></label><button class="ar" onclick="dtShift(1)">›</button><span class="ci">📅</span></div><div class="dtf"><label class="dtl"><span id="tms"></span><input id="tm" type="time" step="1" value="${L0.slice(11,19)}" onchange="dtCh(1)"></label><span class="ci">🕒</span></div></div><input id="a" inputmode="decimal" autocomplete="off" placeholder="Valore € (anche un calcolo)" value="${m?String(m.a).replace('.',','):''}" oninput="pv()"><div class="ops">${['+','−','×','÷','(',')'].map(o=>`<button onclick="ins('${o}')">${o}</button>`).join('')}<button onclick="bk()">⌫</button><button class="eq" onclick="eq()">=</button></div><input id="d" placeholder="Descrizione" value="${m?esc(m.d):''}"><div class="row"><select id="c">${catOpts(m&&m.c)}</select><button class="ic" style="color:var(--tx)" onclick="$('#nc').hidden=false;$('#ncn').focus()">＋</button></div><div class="row" id="nc" hidden><input id="ncn" placeholder="Nome nuova categoria"><button class="btn pri" onclick="saveCat()">Aggiungi</button></div><div class="row"><label class="btn lb">📷 Scatta foto<input type="file" accept="image/*" capture="environment" onmousedown="event.preventDefault()" onchange="pick(this)"></label><label class="btn lb">🖼 Galleria<input type="file" accept="image/*" onmousedown="event.preventDefault()" onchange="pick(this)"></label></div><div id="phw" class="row"></div>${m?`<button class="btn out" onclick="delMov(${m.id})">Elimina</button>`:''}</div></div></div>`,'full');
ph=undefined;curT=t;dtCh();if(m&&m.f)pget(m.id).then(v=>{if(v&&ph===undefined){ph=v;showPh()}});setTimeout(()=>$('#a').focus(),50)}
function dtCh(u){const d=$('#dd'),t=$('#tm'),n=loc(new Date());if(!d.value)d.value=n.slice(0,10);if(!t.value)t.value=n.slice(11,19);const q=d.value.split('-');$('#dds').textContent=q[2]+'-'+MES[+q[1]-1]+'-'+q[0];$('#tms').textContent=t.value.length===5?t.value+':00':t.value;if(u)d.dataset.u=1}
function dtShift(n){const d=$('#dd'),x=new Date(d.value+'T12:00');x.setDate(x.getDate()+n);d.value=loc(x).slice(0,10);dtCh(1)}
function pv(){const t=$('#a').value,el=$('#pv');if(!/[+\-−×x*÷\/:()]/.test(t)){el.textContent=el.dataset.t;el.className='';return}const v=calc(t);el.textContent=v===null?'Calcolo non valido':'= '+eur(v);el.className=v===null?'bad':''}
function ins(s){const a=$('#a'),p=a.selectionStart??a.value.length,q=a.selectionEnd??p;a.setRangeText(s,p,q,'end');a.focus();pv()}
function bk(){const a=$('#a');let p=a.selectionStart,q=a.selectionEnd;if(p===q){if(!p)return;p--}a.setRangeText('',p,q,'end');a.focus();pv()}
function eq(){const v=calc($('#a').value);if(v!==null){$('#a').value=String(Math.round(v*100)/100).replace('.',',');pv()}}
function saveCat(){const n=$('#ncn').value.trim();if(!n)return;let c=S.cats.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!c){c={id:id(),name:n};S.cats.push(c);save()}$('#c').innerHTML=catOpts(c.id);$('#nc').hidden=true;$('#ncn').value=''}
function saveMov(t,mid){const v=calc($('#a').value);if(v===null||v<=0){$('#pv').textContent='Inserisci un importo valido';$('#pv').className='bad';return}
const e=cur(),a=Math.round(v*100)/100,d=$('#d').value.trim()||(t==='in'?'Ricevuto':'Pagato'),c=+$('#c').value||null;
const dd=$('#dd'),tm=$('#tm'),mm=mid?e.moves.find(x=>x.id===mid):null,ts=dd.dataset.u?new Date(dd.value+'T'+(tm.value.length===5?tm.value+':00':tm.value)).toISOString():mm?mm.ts:new Date().toISOString();
let mv=mm;if(mm)Object.assign(mm,{t,a,d,c,ts});else{mv={id:id(),t,a,d,c,ts};e.moves.push(mv)}
if(ph)pput(mv.id,ph).then(k=>{if(k===undefined)toast('Foto non salvata');else{mv.f=1;save();render()}});
else if(ph===''&&mv.f){delete mv.f;pdel(mv.id)}
save();closeM();render()}
function delMov(mid){const e=cur(),i=e.moves.findIndex(x=>x.id===mid),m=e.moves.splice(i,1)[0];save();closeM();render();toast('Voce eliminata',()=>{e.moves.push(m);save();render()})}

function sumH(){const e=cur(),i=tot(e,'in'),o=tot(e,'out'),r=i-o;
const by=t=>{const m={};e.moves.filter(x=>x.t===t).forEach(x=>{const k=catName(x.c)||'Senza categoria';m[k]=(m[k]||0)+x.a});return Object.entries(m).map(([k,v])=>`<div class="line"><span>${esc(k)}</span><b style="color:var(--${t})">${eur(v)}</b></div>`).join('')};
const bi=by('in'),bo=by('out');
return `<header><button class="ic" onclick="go('ev')">‹</button><h1>Riepilogo</h1></header><main><h2>${esc(e.name)}</h2><small>Evento del ${fdate(e.date)}${e.closed?' · chiuso':''}</small><div class="line big" style="margin-top:12px"><span>Totale entrate</span><b style="color:var(--in)">${eur(i)}</b></div><div class="line big"><span>Totale spese</span><b style="color:var(--out)">${eur(o)}</b></div><div class="ricavo" style="color:var(--${r>=0?'in':'out'})"><small style="color:inherit">RICAVO</small><b>${eur(r)}</b><small style="color:inherit">${r>=0?'In attivo':'In perdita'}</small></div>${bi?`<h3>Entrate per categoria</h3>${bi}`:''}${bo?`<h3>Spese per categoria</h3>${bo}`:''}<div class="stack"><button class="btn pri" onclick="shareTxt()">Condividi riepilogo</button><button class="btn" onclick="xlsxEv()">Esporta in Excel (.xlsx)</button><button class="btn" onclick="printEv()">Esporta in PDF (tabelle)</button></div></main>`}
const sorted=e=>[...e.moves].sort((a,b)=>a.ts.localeCompare(b.ts)||a.id-b.id);
async function shareTxt(){const e=cur(),i=tot(e,'in'),o=tot(e,'out');
const t=`${e.name} — ${fdate(e.date)}\nEntrate: ${eur(i)}\nSpese: ${eur(o)}\nRICAVO: ${eur(i-o)}\n\n`+sorted(e).map(m=>`${fmt(m.ts)}  ${m.t==='in'?'+':'−'}${eur(m.a)}  ${m.d}${catName(m.c)?' ['+catName(m.c)+']':''}`).join('\n');
try{if(navigator.share){await navigator.share({text:t});return}}catch(x){if(x.name==='AbortError')return}box('Riepilogo',t)}
async function copyTsv(){const e=cur(),n=v=>String(v).replace('.',','),i=tot(e,'in'),o=tot(e,'out');
const t=['Data e ora\tTipo\tCategoria\tDescrizione\tImporto',...sorted(e).map(m=>[fmt(m.ts),m.t==='in'?'Entrata':'Spesa',catName(m.c),m.d,n(m.a)].join('\t')),`TOTALE ENTRATE\t\t\t\t${n(i)}`,`TOTALE SPESE\t\t\t\t${n(o)}`,`RICAVO\t\t\t\t${n(Math.round((i-o)*100)/100)}`].join('\n');
if(await copy(t))toast('Copiato: incollalo in Excel o Fogli');else box('Copia per Excel',t)}

function catH(){return `<header><button class="ic" onclick="go('list')">‹</button><h1>Categorie</h1></header><main>${S.cats.length?S.cats.map(c=>`<div class="card"><button class="ic" style="padding:6px 8px" onclick="catCol(${c.id})"><i class="dot" style="background:${ccol(c.id)};width:22px;height:22px;margin:0"></i></button><input class="plain" value="${esc(c.name)}" onchange="renCat(${c.id},this.value)"><button class="ic" onclick="sure('Eliminare la categoria “${esc(c.name).replace(/'/g,'')}”? Le voci restano, senza categoria.',()=>delCat(${c.id}))">🗑</button></div>`).join(''):'<p class="empty">Nessuna categoria.<br>Aggiungine una (es. Benzina, Pedaggio, Hotel).</p>'}</main><footer><div class="two"><input id="nn" placeholder="Nuova categoria"><button class="btn pri" onclick="addC()">Aggiungi</button></div></footer>`}
function addC(){const n=$('#nn').value.trim();if(!n)return;if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase())){toast('Esiste già');return}S.cats.push({id:id(),name:n});save();render()}
function renCat(i,v){const n=v.trim();if(!n||S.cats.some(c=>c.id!==i&&c.name.toLowerCase()===n.toLowerCase())){render();toast('Nome non valido o già esistente');return}S.cats.find(c=>c.id===i).name=n;save()}
function delCat(i){S.cats=S.cats.filter(c=>c.id!==i);S.events.forEach(e=>e.moves.forEach(m=>{if(m.c===i)m.c=null}));save();render()}
start();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body></html>
