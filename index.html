<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14876f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Incassi">
<title>Incassi Eventi</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f3f7f6;--card:#fff;--tx:#17302b;--mut:#5d7570;--pri:#14876f;--hd:#14876f;--in:#2e7d32;--out:#c62828;--bd:#d3dfdc;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--card:#172622;--tx:#e6f0ee;--mut:#9db5b0;--pri:#1f9d84;--hd:#0f5f50;--in:#66bb6a;--out:#ef6b6b;--bd:#2c4540;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b18;--card:#172622;--tx:#e6f0ee;--mut:#9db5b0;--pri:#1f9d84;--hd:#0f5f50;--in:#66bb6a;--out:#ef6b6b;--bd:#2c4540;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;background:var(--hd);color:#fff;padding:8px 10px}
header img{width:34px;height:34px;border-radius:8px}
h1{flex:1;margin:0;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{margin:0}h3{margin:18px 0 4px}
main{flex:1;overflow-y:auto;padding:10px}
footer{padding:8px 10px;border-top:1px solid var(--bd);background:var(--card)}
small{display:block;font-size:12px;color:var(--mut)}
.ic{background:none;border:0;color:inherit;font-size:22px;padding:6px 10px}
.card{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card>div:first-child{flex:1;min-width:0}.r{text-align:right}
.card .ic{color:var(--tx)}
.empty{text-align:center;color:var(--mut);margin-top:60px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:13px;font:inherit;font-weight:600}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.in{background:var(--in);color:#fff;border-color:var(--in)}
.btn.out{background:var(--out);color:#fff;border-color:var(--out)}
.btn:disabled{opacity:.4}
.two{display:flex;gap:10px}.two>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.tots{display:flex;margin-top:8px;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.tots>div{flex:1;text-align:center;padding:6px 2px;border-left:1px solid var(--bd)}.tots>div:first-child{border:0}
.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.line.big{font-size:18px}
.ricavo{text-align:center;margin:18px 0;padding:18px;border:2px solid currentColor;border-radius:14px}
.ricavo b{display:block;font-size:34px}
input,select,textarea{font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%;box-sizing:border-box}
input.plain{border:0;background:none;padding:6px}
#a{font-size:22px}
.row{display:flex;gap:6px;align-items:center}
.ops{display:flex;gap:4px}
.ops button{flex:1;padding:10px 0;font-size:18px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.ops .eq{background:var(--pri);color:#fff;border-color:var(--pri)}
#pv{min-height:20px;font-weight:600;color:var(--pri)}.bad{color:var(--out)!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sh{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;top:0;left:0;right:0;z-index:9;display:none;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
#toast.on{display:flex}
#toast span{background:#222;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center}
#toast button{background:none;border:0;color:#8fe3cf;font:inherit;font-weight:700}
@media print{html,body,#app{height:auto}header,footer,.stack{display:none}main{overflow:visible}}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const ICON=document.querySelector('link[rel=apple-touch-icon]').href;
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const fmt=s=>new Date(s).toLocaleString('it-IT');
const fdate=s=>new Date(s).toLocaleDateString('it-IT');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={events:[],cats:[],nid:1};
try{const r=localStorage.getItem('incassi:v1');if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem('incassi:v1',JSON.stringify(S))}catch(e){}};
const id=()=>S.nid++;
let view={n:'list'};
const cur=()=>S.events.find(e=>e.id===view.id);
const catName=c=>(S.cats.find(x=>x.id===c)||{}).name||'';
const tot=(e,t)=>e.moves.filter(m=>m.t===t).reduce((s,m)=>s+m.a,0);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

function calc(s){s=s.replace(/\s/g,'').replace(/[×xX*]/g,'*').replace(/[÷:\/]/g,'/').replace(/−/g,'-').replace(/,/g,'.');if(!s)return null;let i=0;
const num=()=>{if(s[i]==='-'){i++;return -num()}if(s[i]==='+'){i++;return num()}if(s[i]==='('){i++;const v=ex();if(s[i]!==')')throw 0;i++;return v}const m=/^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
const tm=()=>{let v=num();while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=num();if(o==='/'&&!r)throw 0;v=o==='*'?v*r:v/r}return v};
const ex=()=>{let v=tm();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=tm();v=o==='+'?v+r:v-r}return v};
try{const v=ex();return i===s.length&&isFinite(v)?v:null}catch(e){return null}}

function modal(h){$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sh">${h}</div></div>`}
const closeM=()=>{$('#modal').innerHTML=''};
function toast(t,undo){const e=$('#toast');e.innerHTML=`<span>${esc(t)}${undo?'<button id="u">Annulla</button>':''}</span>`;e.className='on';if(undo)$('#u').onclick=()=>{undo();e.className=''};clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',6000)}
function sure(t,fn,ok='Elimina'){window.cb=fn;modal(`<h2>Conferma</h2><p>${esc(t)}</p><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn out" onclick="closeM();cb()">${ok}</button></div>`)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const x=$('#bx');if(x){x.select();try{return document.execCommand('copy')}catch(_){}}return false}}
function box(t,text){modal(`<h2>${esc(t)}</h2><textarea id="bx" readonly rows="7">${esc(text)}</textarea><div class="two"><button class="btn" onclick="closeM()">Chiudi</button><button class="btn pri" onclick="cp()">Copia</button></div>`)}
async function cp(){toast(await copy($('#bx').value)?'Copiato':'Seleziona il testo e copialo a mano')}

function render(){const a=$('#app');a.innerHTML={list:listH,ev:evH,sum:sumH,cat:catH}[view.n]()}
const go=n=>{view.n=n;render()};
const open_=i=>{view={n:'ev',id:i};render()};

function listH(){const ev=[...S.events].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
return `<header><img src="${ICON}" alt=""><h1>I miei eventi</h1><button class="ic" onclick="menu()">⋮</button></header><main>${ev.length?ev.map(e=>{const s=tot(e,'in')-tot(e,'out');return `<div class="card" onclick="open_(${e.id})"><div><b>${esc(e.name)}</b><small>${fdate(e.date)}${e.closed?' · chiuso':''}</small></div><b style="color:var(--${s>=0?'in':'out'})">${eur(s)}</b><button class="ic" onclick="event.stopPropagation();evMenu(${e.id})">⋯</button></div>`}).join(''):'<p class="empty">Nessun evento.<br>Tocca “Nuovo evento” per iniziare.</p>'}</main><footer><button class="btn pri" style="width:100%" onclick="newEv()">+ Nuovo evento</button></footer>`}

function menu(){modal(`<h2>Menu</h2><div class="stack" style="margin:0"><button class="btn" onclick="closeM();go('cat')">Categorie</button><button class="btn" onclick="box('Backup dati (copia e conserva questo testo)',JSON.stringify(S))">Backup dati</button><button class="btn" onclick="restore()">Ripristina backup</button></div>`)}
function restore(){modal(`<h2>Ripristina backup</h2><small>Incolla qui il testo del backup. Sostituirà tutti i dati attuali.</small><textarea id="rj" rows="6"></textarea><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn pri" onclick="doRestore()">Ripristina</button></div>`)}
function doRestore(){try{const o=JSON.parse($('#rj').value);if(!Array.isArray(o.events)||!Array.isArray(o.cats))throw 0;S=o;S.nid=S.nid||1e6;save();closeM();view={n:'list'};render();toast('Backup ripristinato')}catch(e){toast('Testo di backup non valido')}}

function newEv(){modal(`<h2>Nuovo evento</h2><input id="en" placeholder="Nome evento"><input id="ed" type="date" value="${today()}"><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn pri" onclick="addEv()">Crea</button></div>`);setTimeout(()=>$('#en').focus(),50)}
function addEv(){const n=$('#en').value.trim();if(!n)return;const d=$('#ed').value||today();S.events.push({id:id(),name:n,date:new Date(d+'T12:00').toISOString(),closed:false,created:new Date().toISOString(),moves:[]});save();closeM();render()}
function evMenu(i){const e=S.events.find(x=>x.id===i);modal(`<h2>${esc(e.name)}</h2><div class="stack" style="margin:0"><button class="btn" onclick="ren(${i})">Rinomina</button><button class="btn" onclick="imp(${i})">Importa da Excel</button><button class="btn" onclick="dup(${i})">Duplica (senza movimenti)</button><button class="btn out" onclick="sure('Eliminare l’evento e tutti i suoi movimenti?',()=>delEv(${i}))">Elimina evento</button></div>`)}
function dup(i){const e=S.events.find(x=>x.id===i),n=new Date().toISOString();S.events.push({id:id(),name:e.name+' (copia)',date:n,closed:false,created:n,moves:[]});save();closeM();render()}
function delEv(i){S.events=S.events.filter(x=>x.id!==i);save();render()}
function ren(i){closeM();const e=S.events.find(x=>x.id===i);modal(`<h2>Rinomina evento</h2><input id="rn" value="${esc(e.name)}"><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn pri" onclick="doRen(${i})">Salva</button></div>`);setTimeout(()=>$('#rn').select(),50)}
function doRen(i){const n=$('#rn').value.trim();if(!n)return;S.events.find(x=>x.id===i).name=n;save();closeM();render()}
function imp(i){modal(`<h2>Importa da Excel</h2><small>File .xlsx o .csv con colonne: Data, Tipo (Entrata/Spesa), Categoria, Descrizione, Importo. Le voci vengono aggiunte a questo evento.</small><input id="xf" type="file" accept=".xlsx,.xls,.csv"><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn pri" onclick="doImp(${i})">Importa</button></div>`)}
const pdate=v=>{if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)+new Date().getTimezoneOffset()*6e4);const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[, ]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/.exec(String(v||''));if(m)return new Date(+m[3],m[2]-1,+m[1],+(m[4]||12),+(m[5]||0),+(m[6]||0));const d=new Date(v);return isNaN(d)?new Date():d};
async function doImp(i){const fl=$('#xf').files[0];if(!fl)return toast('Scegli un file');if(typeof XLSX==='undefined')return toast('Libreria Excel non caricata: riprova con la connessione attiva');
try{const wb=XLSX.read(await fl.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}),e=S.events.find(x=>x.id===i);
const h={d:0,t:1,c:2,s:3,a:4};let st=0;const f0=rows[0]||[];
if(f0.some(x=>typeof x==='string'&&/importo|amount|descr|tipo|data/i.test(x))){st=1;f0.forEach((x,k)=>{x=String(x).toLowerCase();if(/data|date/.test(x))h.d=k;else if(/tipo|type/.test(x))h.t=k;else if(/categ/.test(x))h.c=k;else if(/descr/.test(x))h.s=k;else if(/importo|amount|valore/.test(x))h.a=k})}
let n=0;for(const r of rows.slice(st)){if(/^(totale|ricavo)/i.test(String(r[h.d]??'')))continue;
const a=typeof r[h.a]==='number'?r[h.a]:calc(String(r[h.a]??'').replace(/[€\s]/g,''));if(a===null||!a)continue;
const tp=String(r[h.t]??'').toLowerCase().trim(),t=/^(entr|ric|in|\+)/.test(tp)?'in':/^(spes|pag|out|usc|-|−)/.test(tp)?'out':a<0?'out':'in';
const cn=String(r[h.c]??'').trim();let c=null;if(cn){let k=S.cats.find(x=>x.name.toLowerCase()===cn.toLowerCase());if(!k){k={id:id(),name:cn};S.cats.push(k)}c=k.id}
e.moves.push({id:id(),t,a:Math.round(Math.abs(a)*100)/100,d:String(r[h.s]??'').trim()||(t==='in'?'Ricevuto':'Pagato'),c,ts:pdate(r[h.d]).toISOString()});n++}
save();closeM();render();toast(n+' voci importate')}catch(x){toast('File non leggibile')}}

function evH(){const e=cur(),dis=e.closed?'disabled':'';
const ms=[...e.moves].sort((a,b)=>b.ts.localeCompare(a.ts)||b.id-a.id);let b=0;const run={};
[...e.moves].sort((a,b)=>a.ts.localeCompare(b.ts)||a.id-b.id).forEach(m=>{b+=m.t==='in'?m.a:-m.a;run[m.id]=b});
const i=tot(e,'in'),o=tot(e,'out'),r=i-o,cell=(l,v,c)=>`<div><small>${l}</small><b style="color:var(--${c})">${eur(v)}</b></div>`;
return `<header><button class="ic" onclick="go('list')">‹</button><h1 onclick="ren(${e.id})">${esc(e.name)} ✎</h1><button class="ic" onclick="go('sum')">📊</button><button class="ic" onclick="toggle()">${e.closed?'🔒':'🔓'}</button></header><main>${ms.length?ms.map(m=>`<div class="card" ${e.closed?'':`onclick="mov('${m.t}',${m.id})"`}><div><b>${esc(m.d)}</b><small>${catName(m.c)?esc(catName(m.c))+' · ':''}${fmt(m.ts)}</small></div><div class="r"><b style="color:var(--${m.t})">${eur(m.a)}</b><small>Bilancio ${eur(run[m.id])}</small></div></div>`).join(''):'<p class="empty">Nessun movimento.<br>Usa i pulsanti in basso.</p>'}</main><footer><div class="two"><button class="btn in" ${dis} onclick="mov('in')">Hai Ricevuto</button><button class="btn out" ${dis} onclick="mov('out')">Hai Pagato</button></div><div class="tots">${cell('Totale Ricevuto',i,'in')}${cell('Totale Pagato',o,'out')}${cell('Ricavo',r,r>=0?'in':'out')}</div></footer>`}
function toggle(){const e=cur();e.closed=!e.closed;save();view.n=e.closed?'sum':'ev';render()}

const catOpts=s=>`<option value="">Nessuna categoria</option>`+S.cats.map(c=>`<option value="${c.id}" ${c.id===s?'selected':''}>${esc(c.name)}</option>`).join('');
function mov(t,mid){const e=cur(),m=mid?e.moves.find(x=>x.id===mid):null;
modal(`<h2 style="color:var(--${t})">${m?'Modifica voce':t==='in'?'Hai ricevuto':'Hai pagato'}</h2><input id="a" inputmode="decimal" autocomplete="off" placeholder="Valore € (anche un calcolo)" value="${m?String(m.a).replace('.',','):''}" oninput="pv()"><div class="ops">${['+','−','×','÷','(',')'].map(o=>`<button onclick="ins('${o}')">${o}</button>`).join('')}<button onclick="bk()">⌫</button><button class="eq" onclick="eq()">=</button></div><div id="pv"></div><input id="d" placeholder="Descrizione" value="${m?esc(m.d):''}"><div class="row"><select id="c">${catOpts(m&&m.c)}</select><button class="ic" style="color:var(--tx)" onclick="$('#nc').hidden=false;$('#ncn').focus()">＋</button></div><div class="row" id="nc" hidden><input id="ncn" placeholder="Nome nuova categoria"><button class="btn pri" onclick="saveCat()">Aggiungi</button></div><div class="two">${m?`<button class="btn out" onclick="delMov(${m.id})">Elimina</button>`:'<button class="btn" onclick="closeM()">Annulla</button>'}<button class="btn ${t}" onclick="saveMov('${t}',${mid||0})">Salva</button></div>`);setTimeout(()=>$('#a').focus(),50)}
function pv(){const t=$('#a').value,el=$('#pv');if(!/[+\-−×x*÷\/:()]/.test(t)){el.textContent='';el.className='';return}const v=calc(t);el.textContent=v===null?'Calcolo non valido':'= '+eur(v);el.className=v===null?'bad':''}
function ins(s){const a=$('#a'),p=a.selectionStart??a.value.length,q=a.selectionEnd??p;a.setRangeText(s,p,q,'end');a.focus();pv()}
function bk(){const a=$('#a');let p=a.selectionStart,q=a.selectionEnd;if(p===q){if(!p)return;p--}a.setRangeText('',p,q,'end');a.focus();pv()}
function eq(){const v=calc($('#a').value);if(v!==null){$('#a').value=String(Math.round(v*100)/100).replace('.',',');pv()}}
function saveCat(){const n=$('#ncn').value.trim();if(!n)return;let c=S.cats.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!c){c={id:id(),name:n};S.cats.push(c);save()}$('#c').innerHTML=catOpts(c.id);$('#nc').hidden=true;$('#ncn').value=''}
function saveMov(t,mid){const v=calc($('#a').value);if(v===null||v<=0){$('#pv').textContent='Inserisci un importo valido';$('#pv').className='bad';return}
const e=cur(),a=Math.round(v*100)/100,d=$('#d').value.trim()||(t==='in'?'Ricevuto':'Pagato'),c=+$('#c').value||null;
if(mid)Object.assign(e.moves.find(x=>x.id===mid),{a,d,c});else e.moves.push({id:id(),t,a,d,c,ts:new Date().toISOString()});
save();closeM();render()}
function delMov(mid){const e=cur(),i=e.moves.findIndex(x=>x.id===mid),m=e.moves.splice(i,1)[0];save();closeM();render();toast('Voce eliminata',()=>{e.moves.push(m);save();render()})}

function sumH(){const e=cur(),i=tot(e,'in'),o=tot(e,'out'),r=i-o;
const by=t=>{const m={};e.moves.filter(x=>x.t===t).forEach(x=>{const k=catName(x.c)||'Senza categoria';m[k]=(m[k]||0)+x.a});return Object.entries(m).map(([k,v])=>`<div class="line"><span>${esc(k)}</span><b style="color:var(--${t})">${eur(v)}</b></div>`).join('')};
const bi=by('in'),bo=by('out');
return `<header><button class="ic" onclick="go('ev')">‹</button><h1>Riepilogo</h1></header><main><h2>${esc(e.name)}</h2><small>Evento del ${fdate(e.date)}${e.closed?' · chiuso':''}</small><div class="line big" style="margin-top:12px"><span>Totale entrate</span><b style="color:var(--in)">${eur(i)}</b></div><div class="line big"><span>Totale spese</span><b style="color:var(--out)">${eur(o)}</b></div><div class="ricavo" style="color:var(--${r>=0?'in':'out'})"><small style="color:inherit">RICAVO</small><b>${eur(r)}</b><small style="color:inherit">${r>=0?'In attivo':'In perdita'}</small></div>${bi?`<h3>Entrate per categoria</h3>${bi}`:''}${bo?`<h3>Spese per categoria</h3>${bo}`:''}<div class="stack"><button class="btn pri" onclick="shareTxt()">Condividi riepilogo</button><button class="btn" onclick="copyTsv()">Copia per Excel</button><button class="btn" onclick="print()">Stampa / salva PDF</button></div></main>`}
const sorted=e=>[...e.moves].sort((a,b)=>a.ts.localeCompare(b.ts)||a.id-b.id);
async function shareTxt(){const e=cur(),i=tot(e,'in'),o=tot(e,'out');
const t=`${e.name} — ${fdate(e.date)}\nEntrate: ${eur(i)}\nSpese: ${eur(o)}\nRICAVO: ${eur(i-o)}\n\n`+sorted(e).map(m=>`${fmt(m.ts)}  ${m.t==='in'?'+':'−'}${eur(m.a)}  ${m.d}${catName(m.c)?' ['+catName(m.c)+']':''}`).join('\n');
try{if(navigator.share){await navigator.share({text:t});return}}catch(x){if(x.name==='AbortError')return}box('Riepilogo',t)}
async function copyTsv(){const e=cur(),n=v=>String(v).replace('.',','),i=tot(e,'in'),o=tot(e,'out');
const t=['Data e ora\tTipo\tCategoria\tDescrizione\tImporto',...sorted(e).map(m=>[fmt(m.ts),m.t==='in'?'Entrata':'Spesa',catName(m.c),m.d,n(m.a)].join('\t')),`TOTALE ENTRATE\t\t\t\t${n(i)}`,`TOTALE SPESE\t\t\t\t${n(o)}`,`RICAVO\t\t\t\t${n(Math.round((i-o)*100)/100)}`].join('\n');
if(await copy(t))toast('Copiato: incollalo in Excel o Fogli');else box('Copia per Excel',t)}

function catH(){return `<header><button class="ic" onclick="go('list')">‹</button><h1>Categorie</h1></header><main>${S.cats.length?S.cats.map(c=>`<div class="card"><input class="plain" value="${esc(c.name)}" onchange="renCat(${c.id},this.value)"><button class="ic" onclick="sure('Eliminare la categoria “${esc(c.name).replace(/'/g,'')}”? Le voci restano, senza categoria.',()=>delCat(${c.id}))">🗑</button></div>`).join(''):'<p class="empty">Nessuna categoria.<br>Aggiungine una (es. Benzina, Pedaggio, Hotel).</p>'}</main><footer><div class="two"><input id="nn" placeholder="Nuova categoria"><button class="btn pri" onclick="addC()">Aggiungi</button></div></footer>`}
function addC(){const n=$('#nn').value.trim();if(!n)return;if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase())){toast('Esiste già');return}S.cats.push({id:id(),name:n});save();render()}
function renCat(i,v){const n=v.trim();if(!n||S.cats.some(c=>c.id!==i&&c.name.toLowerCase()===n.toLowerCase())){render();toast('Nome non valido o già esistente');return}S.cats.find(c=>c.id===i).name=n;save()}
function delCat(i){S.cats=S.cats.filter(c=>c.id!==i);S.events.forEach(e=>e.moves.forEach(m=>{if(m.c===i)m.c=null}));save();render()}
render();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
