<html lang="it"><head><meta charset="utf-8">

<style>
:root{--bg:#f3f7f6;--card:#fff;--tx:#17302b;--mut:#5d7570;--pri:#14876f;--hd:#14876f;--in:#2e7d32;--out:#c62828;--bd:#d3dfdc;--yel:#e0a100;--gr:#00a343;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b18;--card:#172622;--tx:#e6f0ee;--mut:#9db5b0;--pri:#1f9d84;--hd:#0f5f50;--in:#66bb6a;--out:#ef6b6b;--bd:#2c4540;--yel:#ffd54f;--gr:#00e676;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b18;--card:#172622;--tx:#e6f0ee;--mut:#9db5b0;--pri:#1f9d84;--hd:#0f5f50;--in:#66bb6a;--out:#ef6b6b;--bd:#2c4540;--yel:#ffd54f;--gr:#00e676;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;background:var(--hd);color:#fff;padding:8px 10px}
header img{width:34px;height:34px;border-radius:8px}
h1{flex:1;margin:0;font-size:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{margin:0}h3{margin:18px 0 4px}
main{flex:1;overflow-y:auto;padding:10px}
footer{padding:8px 10px;border-top:1px solid var(--bd);background:var(--card)}
small{display:block;font-size:12px;color:var(--mut)}
.ic{background:none;border:0;color:inherit;font-size:22px;padding:6px 10px}
.card{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.card>div:first-child{flex:1;min-width:0}.r{text-align:right}
.card .ic{color:var(--tx)}
.empty{text-align:center;color:var(--mut);margin-top:60px}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:13px;font:inherit;font-weight:600}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn.in{background:var(--in);color:#fff;border-color:var(--in)}
.btn.out{background:var(--out);color:#fff;border-color:var(--out)}
.btn:disabled{opacity:.4}
.two{display:flex;gap:10px}.two>*{flex:1}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.tots{display:flex;margin-top:8px;border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.tots>div{flex:1;text-align:center;padding:6px 2px;border-left:1px solid var(--bd)}.tots>div:first-child{border:0}
.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
.line.big{font-size:18px}
.ricavo{text-align:center;margin:18px 0;padding:18px;border:2px solid currentColor;border-radius:14px}
.ricavo b{display:block;font-size:34px}
input,select,textarea{font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);width:100%;box-sizing:border-box}
input.plain{border:0;background:none;padding:6px}
#a{font-size:22px}
.row{display:flex;gap:6px;align-items:center}
.ops{display:flex;gap:4px}
.ops button{flex:1;padding:10px 0;font-size:18px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
.ops .eq{background:var(--pri);color:#fff;border-color:var(--pri)}
#pv{min-height:20px;font-weight:600;color:var(--pri)}.bad{color:var(--out)!important}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:5}
.sh{background:var(--card);width:100%;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
#toast{position:fixed;top:0;left:0;right:0;z-index:9;display:none;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0}
#toast.on{display:flex}
#toast span{background:#222;color:#fff;border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:center}
#toast button{background:none;border:0;color:#8fe3cf;font:inherit;font-weight:700}
.card{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.card input{user-select:text;-webkit-user-select:text}
.sw{display:flex;flex-wrap:wrap;gap:12px}.sw button{width:48px;height:48px;border-radius:50%;border:2px solid var(--bd)}.sw .none{width:auto;border-radius:24px;padding:0 16px;background:var(--card);color:var(--tx);font:inherit}
.bar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;background:var(--card);margin:-16px -16px 0;padding:12px 16px}.bar h2{flex:1;margin:0;font-size:18px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .btn{padding:10px 14px}.sh{scroll-padding-top:88px}.ov.top{align-items:flex-start}.ov.top .sh{border-radius:0 0 18px 18px}.ov.top .bar{padding-top:calc(12px + env(safe-area-inset-top,0px))}.th{height:44px;border-radius:8px;border:1px solid var(--bd)}.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;padding:8px 14px;font:inherit}.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}.chip.ev.on{background:var(--card);color:var(--tx);border:2px solid var(--c)}.chip.off{opacity:.45;text-decoration:line-through}.chip i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}.ic:disabled{opacity:.25}.lb{position:relative;overflow:hidden;flex:1;text-align:center}.lb input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:0;padding:0;border:0}#phw:empty{display:none}#lock{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}.dots{display:flex;gap:14px}.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--pri)}.dots i.f{background:var(--pri)}.kp{display:grid;grid-template-columns:repeat(3,76px);gap:14px}.kp button{height:64px;border-radius:50%;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:24px}#lm{min-height:22px;font-weight:600}[hidden]{display:none!important}.sh input,.sh select,.sh textarea{border:1.5px solid color-mix(in srgb,var(--mut) 60%,transparent);border-radius:12px}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);box-shadow:none}.sh{scroll-padding-top:88px}#a{border-width:2px;padding:12px 14px}.ops button{border:1.5px solid color-mix(in srgb,var(--mut) 50%,transparent)}
@media print{html,body,#app{height:auto}header,footer,.stack{display:none}main{overflow:visible}}
</style></head><body>
<div id="app"></div><div id="modal"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const ICON=document.querySelector('link[rel=apple-touch-icon]').href;
const eur=n=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(n);
const fmt=s=>new Date(s).toLocaleString('it-IT');
const fdate=s=>new Date(s).toLocaleDateString('it-IT');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={events:[],cats:[],nid:1};
try{const r=localStorage.getItem('incassi:v1');if(r)S=JSON.parse(r)}catch(e){}
const save=()=>{try{localStorage.setItem('incassi:v1',JSON.stringify(S))}catch(e){}};
const id=()=>S.nid++;
function mig(){if(!S.gest||!S.gest.length){const g={id:id(),name:'Gestione 1'};S.gest=[g];S.g=g.id;S.events.sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id)}S.events.forEach(e=>{if(!S.gest.some(g=>g.id===e.g))e.g=S.gest[0].id});if(!S.gest.some(g=>g.id===S.g))S.g=S.gest[0].id}
mig();
let view={n:'list'};
const cur=()=>S.events.find(e=>e.id===view.id);
const catName=c=>(S.cats.find(x=>x.id===c)||{}).name||'';
const tot=(e,t)=>e.moves.filter(m=>m.t===t).reduce((s,m)=>s+m.a,0);
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);

function calc(s){s=s.replace(/\s/g,'').replace(/[×xX*]/g,'*').replace(/[÷:\/]/g,'/').replace(/−/g,'-').replace(/,/g,'.');if(!s)return null;let i=0;
const num=()=>{if(s[i]==='-'){i++;return -num()}if(s[i]==='+'){i++;return num()}if(s[i]==='('){i++;const v=ex();if(s[i]!==')')throw 0;i++;return v}const m=/^\d*\.?\d+|^\d+\.?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])};
const tm=()=>{let v=num();while(s[i]==='*'||s[i]==='/'){const o=s[i++],r=num();if(o==='/'&&!r)throw 0;v=o==='*'?v*r:v/r}return v};
const ex=()=>{let v=tm();while(s[i]==='+'||s[i]==='-'){const o=s[i++],r=tm();v=o==='+'?v+r:v-r}return v};
try{const v=ex();return i===s.length&&isFinite(v)?v:null}catch(e){return null}}

function modal(h,t){$('#modal').innerHTML=`<div class="ov${t?' top':''}" onclick="if(event.target===this)closeM()"><div class="sh">${h}</div></div>`;kb()}
const closeM=()=>{$('#modal').innerHTML=''};
function kb(){const v=window.visualViewport,o=$('#modal .ov');if(!v||!o)return;o.style.paddingBottom=Math.max(0,innerHeight-v.height-v.offsetTop)+'px';o.style.paddingTop=v.offsetTop+'px'}
if(window.visualViewport){visualViewport.addEventListener('resize',kb);visualViewport.addEventListener('scroll',kb)}
document.addEventListener('focusin',e=>{if(e.target.closest('#modal'))setTimeout(()=>{kb();if(e.target.id!=='a')e.target.scrollIntoView({block:'nearest'})},300)});
function toast(t,undo){const e=$('#toast');e.innerHTML=`<span>${esc(t)}${undo?'<button id="u">Annulla</button>':''}</span>`;e.className='on';if(undo)$('#u').onclick=()=>{undo();e.className=''};clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',6000)}
function sure(t,fn,ok='Elimina'){window.cb=fn;modal(`<h2>Conferma</h2><p>${esc(t)}</p><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn out" onclick="closeM();cb()">${ok}</button></div>`)}
async function copy(t){try{await navigator.clipboard.writeText(t);return true}catch(e){const x=$('#bx');if(x){x.select();try{return document.execCommand('copy')}catch(_){}}return false}}
function box(t,text){modal(`<h2>${esc(t)}</h2><textarea id="bx" readonly rows="7">${esc(text)}</textarea><div class="two"><button class="btn" onclick="closeM()">Chiudi</button><button class="btn pri" onclick="cp()">Copia</button></div>`)}
async function cp(){toast(await copy($('#bx').value)?'Copiato':'Seleziona il testo e copialo a mano')}

function render(){const a=$('#app');a.innerHTML={list:listH3,ev:evH,sum:sumH2,cat:catH,gr:grH2}[view.n]()}
const go=n=>{view.n=n;render()};
const open_=i=>{view={n:'ev',id:i};render()};

function listH(){const ev=[...S.events].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
return `<header><img src="${ICON}" alt=""><h1>I miei eventi</h1><button class="ic" onclick="menu()">⋮</button></header><main>${ev.length?ev.map(e=>{const s=tot(e,'in')-tot(e,'out');return `<div class="card" data-lp="e,${e.id}" style="${tint(e.color,'--card')}" onclick="open_(${e.id})"><div><b>${esc(e.name)}</b><small>${fdate(e.date)}${e.closed?' · chiuso':''}</small></div><b style="color:var(--${s>=0?'in':'out'})">${eur(s)}</b><button class="ic" onclick="event.stopPropagation();evMenu(${e.id})">⋯</button></div>`}).join(''):'<p class="empty">Nessun evento.<br>Tocca “Nuovo evento” per iniziare.</p>'}</main><footer><button class="btn pri" style="width:100%" onclick="newEv()">+ Nuovo evento</button></footer>`}

function menu(){modal(`<h2>Menu</h2><small>Ultimo backup: ${lb()?fmt(lb()):'mai'}</small><div class="stack" style="margin:0"><button class="btn" onclick="closeM();go('cat')">Categorie</button><button class="btn" onclick="xlsxGest()">Esporta gestione in Excel</button><button class="btn" onclick="bkFile()">Backup su file (con foto)</button><button class="btn" onclick="restore2()">Ripristina backup</button><button class="btn" onclick="pinMenu()">Blocco con PIN</button><button class="btn" onclick="guida()">Guida all’uso</button></div><small style="text-align:center">Versione 8</small>`)}
function restore(){modal(`<h2>Ripristina backup</h2><small>Incolla qui il testo del backup. Sostituirà tutti i dati attuali.</small><textarea id="rj" rows="6"></textarea><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn pri" onclick="doRestore()">Ripristina</button></div>`)}
const rd=v=>Math.round(v*100)/100,f2=s=>fmt(s).replace(',',''),slug=s=>String(s).replace(/[^A-Za-z0-9]+/g,'_').replace(/^_|_$/g,'')||'evento';
const sn=(n,u)=>{const b=String(n).replace(/[\[\]:*?\/\\]/g,' ').trim().slice(0,28)||'Evento';let x=b,k=2;while(u.includes(x))x=b+' '+k++;u.push(x);return x};
function wsEv(e){const i=tot(e,'in'),o=tot(e,'out'),A=[['Data e ora','Tipo','Categoria','Descrizione','Importo'],...sorted(e).map(m=>[f2(m.ts),m.t==='in'?'Entrata':'Spesa',catName(m.c),m.d,m.a]),[],['TOTALE ENTRATE','','','',rd(i)],['TOTALE SPESE','','','',rd(o)],['RICAVO','','','',rd(i-o)]],w=XLSX.utils.aoa_to_sheet(A);w['!cols']=[{wch:20},{wch:9},{wch:16},{wch:32},{wch:12}];return w}
async function xlsxOut(wb,name){const type='application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',b=new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type});let fr=false;try{fr=window.top!==window}catch(e){fr=true}
try{const f=new File([b],name,{type});if(fr&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e.name==='AbortError')return}
try{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast(fr?'Se il file non parte, apri la pagina in Chrome o usa l’app installata':'File salvato: '+name)}catch(e){toast('Download non riuscito')}}
const noX=()=>typeof XLSX==='undefined'&&(toast('Libreria Excel non caricata: serve la connessione'),1);
function xlsxEv(){if(noX())return;const e=cur(),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,wsEv(e),sn(e.name,[]));xlsxOut(wb,'Bilancio_'+slug(e.name)+'.xlsx')}
function xlsxGest(){closeM();if(noX())return;const l=gev();if(!l.length)return toast('Nessun evento da esportare');const wb=XLSX.utils.book_new(),u=['Riepilogo'],I=l.reduce((a,e)=>a+tot(e,'in'),0),O=l.reduce((a,e)=>a+tot(e,'out'),0),ws=XLSX.utils.aoa_to_sheet([['Evento','Data','Entrate','Spese','Ricavo'],...l.map(e=>[e.name,fdate(e.date),rd(tot(e,'in')),rd(tot(e,'out')),rd(tot(e,'in')-tot(e,'out'))]),[],['TOTALE','',rd(I),rd(O),rd(I-O)]]);ws['!cols']=[{wch:28},{wch:12},{wch:12},{wch:12},{wch:12}];XLSX.utils.book_append_sheet(wb,ws,'Riepilogo');l.forEach(e=>XLSX.utils.book_append_sheet(wb,wsEv(e),sn(e.name,u)));xlsxOut(wb,'Gestione_'+slug(gname())+'.xlsx')}
const lb=()=>{try{return localStorage.getItem('incassi:lb')}catch(e){return null}};
async function outFile(b,name,type){let fr=false;try{fr=window.top!==window}catch(e){fr=true}
try{const f=new File([b],name,{type});if(fr&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return true}}catch(e){if(e.name==='AbortError')return false}
try{const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);toast(fr?'Se il file non parte, apri la pagina in Chrome o usa l’app installata':'Backup salvato: '+name);return true}catch(e){toast('Download non riuscito');return false}}
async function bkFile(){closeM();toast('Preparo il backup…');const photos={};
for(const e of S.events)for(const m of e.moves)if(m.f){const v=await pget(m.id);if(v)photos[m.id]=v}
const d=new Date(),z=n=>String(n).padStart(2,'0'),name=`Backup_Incassi_${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.json`;
const ok=await outFile(new Blob([JSON.stringify({app:'incassi',v:2,date:d.toISOString(),S,photos})],{type:'application/json'}),name,'application/json');
if(ok)try{localStorage.setItem('incassi:lb',d.toISOString())}catch(e){}}
function restore2(){modal(`<h2>Ripristina backup</h2><small>Scegli il file di backup (.json) salvato con “Backup su file”. Sostituirà tutti i dati attuali.</small><label class="btn lb">📂 Scegli il file di backup<input type="file" accept=".json,application/json,text/plain" onmousedown="event.preventDefault()" onchange="rsFile(this)"></label><small>Hai un vecchio backup in formato testo? Incollalo qui:</small><textarea id="rj" rows="3"></textarea><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn pri" onclick="doRestore()">Ripristina dal testo</button></div>`)}
async function rsFile(i){const f=i.files[0];i.value='';if(!f)return;let o;try{o=JSON.parse(await f.text());if(!(o.S||o).events)throw 0}catch(e){return toast('File di backup non valido')}
sure('Il ripristino sostituisce TUTTI i dati attuali con quelli del backup'+(o.photos?' (foto incluse)':'')+'. Continuare?',()=>applyBackup(o).catch(()=>toast('Ripristino non riuscito')),'Ripristina')}
async function applyBackup(o){const s=o.S||o;if(!Array.isArray(s.events)||!Array.isArray(s.cats))throw 0;S=s;S.nid=S.nid||1e6;mig();save();
if(o.photos)for(const k in o.photos)await pput(+k,o.photos[k]);
clo();view={n:'list'};render();toast('Backup ripristinato'+(o.photos?' (foto incluse)':''))}
const clo=()=>closeM();
const pinGet=()=>{try{return JSON.parse(localStorage.getItem('incassi:pin'))}catch(e){return null}},pinOn=()=>!!pinGet();
async function hp(p,s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s+p)h=(h*33^c.charCodeAt(0))>>>0;return 'x'+h}}
const pinCheck=async v=>{const p=pinGet();return !!p&&await hp(v,p.s)===p.h};
const pa=()=>{try{return JSON.parse(localStorage.getItem('incassi:pa'))||{n:0,u:0}}catch(e){return{n:0,u:0}}},pinWait=()=>Math.max(0,Math.ceil((pa().u-Date.now())/1e3));
function pinFail(){const a=pa();a.n++;if(a.n%5===0)a.u=Date.now()+30e3*Math.pow(2,a.n/5-1);try{localStorage.setItem('incassi:pa',JSON.stringify(a))}catch(e){}}
let lk='',hid=0;
function showLock(cb){window.lcb=cb;lk='';let d=$('#lock');if(!d){d=document.createElement('div');d.id='lock';document.body.appendChild(d)}d.style.display='flex';drawLock()}
function drawLock(msg){const p=pinGet(),n=p?p.n:4;$('#lock').innerHTML=`<img src="${ICON}" alt="" style="width:64px;height:64px;border-radius:16px"><h2>Inserisci il PIN</h2><div class="dots">${[...Array(n)].map((_,i)=>`<i class="${i<lk.length?'f':''}"></i>`).join('')}</div><div id="lm" class="bad">${msg||''}</div><div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button onclick="lkp('${k}')">${k}</button>`).join('')}</div>`}
async function lkp(k){const p=pinGet();if(!p)return;if(pinWait()){drawLock('Troppi tentativi: riprova tra '+pinWait()+' s');return}
if(k==='⌫')lk=lk.slice(0,-1);else if(lk.length<p.n)lk+=k;drawLock();
if(lk.length===p.n){const v=lk;lk='';if(await hp(v,p.s)===p.h){try{localStorage.removeItem('incassi:pa')}catch(e){}$('#lock').style.display='none';window.lcb&&window.lcb()}else{pinFail();drawLock(pinWait()?'Troppi tentativi: riprova tra '+pinWait()+' s':'PIN errato')}}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(pinOn()&&hid&&Date.now()-hid>6e4)showLock()});
function start(){if(pinOn())showLock(render);else render()}

function svgChart(L,B,line){const n=L.length;if(!n)return'';
const sm=(b,f)=>b.filter(f).reduce((a,s)=>a+s.v,0),mx=Math.max(0,...B.map(b=>sm(b,s=>s.v>0)),...(line||[])),mn=Math.min(0,...B.map(b=>sm(b,s=>s.v<0)),...(line||[]));
if(mx===mn)return'<p class="empty" style="margin:30px 0">Nessun dato per la selezione.</p>';
const w=Math.max(340,n*30+50),h=220,pl=46,pt=12,pb=40,bw=(w-pl-8)/n,y=v=>pt+(h-pt-pb)*(mx-v)/(mx-mn),f=v=>Math.round(v).toLocaleString('it-IT');
let s=`<svg viewBox="0 0 ${w} ${h}" style="min-width:100%;width:${w}px;font-size:11px">`;
[...new Set([mx,mn,0])].forEach(v=>{s+=`<line x1="${pl}" x2="${w-4}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--bd)"/><text x="${pl-4}" y="${y(v)+4}" text-anchor="end" style="fill:var(--mut)">${f(v)}</text>`});
B.forEach((b,i)=>{let p=y(0),q=p;const x=pl+i*bw+bw*.15;b.forEach(g=>{const t=Math.abs(y(g.v)-y(0));if(g.v>0){p-=t;s+=`<rect x="${x}" y="${p}" width="${bw*.7}" height="${t}" style="fill:${g.c}"/>`}else{s+=`<rect x="${x}" y="${q}" width="${bw*.7}" height="${t}" style="fill:${g.c}"/>`;q+=t}})});
if(line)s+=`<polyline fill="none" style="stroke:var(--tx)" stroke-width="2" points="${line.map((v,i)=>`${pl+i*bw+bw/2},${y(v)}`).join(' ')}"/>`+line.map((v,i)=>`<circle cx="${pl+i*bw+bw/2}" cy="${y(v)}" r="3" style="fill:var(--tx)"/>`).join('');
L.forEach((l,i)=>{const x=pl+i*bw+bw/2;s+=`<text x="${x}" y="${h-pb+14}" text-anchor="middle" style="fill:var(--mut)">${l.l}</text>`+(l.d?`<text x="${x}" y="${h-pb+26}" text-anchor="middle" font-size="9" style="fill:var(--mut)">${l.d}</text>`:'')});
return `<div style="overflow-x:auto">${s}</svg></div>`}

function evChart(e,k){const ks=e.moves.map(m=>hk(m.ts));if(!ks.length)return'<p class="empty" style="margin:30px 0">Nessun movimento.</p>';
const a=Math.min(...ks),z=Math.min(Math.max(...ks),a+199*36e5),L=[],B=[],line=[];let cum=0,pd='';
for(let t=a;t<=z;t+=36e5){const dd=fdate(t).slice(0,5),v=e.moves.reduce((s,m)=>hk(m.ts)===t?s+sv(m,k):s,0);cum+=v;L.push({l:String(new Date(t).getHours()).padStart(2,'0'),d:dd!==pd?dd:''});pd=dd;B.push(v?[{v,c:k==='net'?(v>0?'var(--gr)':'var(--out)'):k==='in'?'var(--yel)':'var(--out)'}]:[]);line.push(cum)}
return svgChart(L,B,line)}

function lnChart(L,R,rot){const n=L.length;if(!n)return'<p class="empty" style="margin:30px 0">Seleziona almeno un evento.</p>';

const w=Math.max(340,n*(rot?60:34)+60),h=rot?280:230,pl=48,pt=14,pb=rot?96:34,x=i=>n>1?pl+12+i*(w-pl-26)/(n-1):(pl+w)/2,y=v=>pt+(h-pt-pb)*(mx-v)/(mx-mn),f=v=>Math.round(v).toLocaleString('it-IT');
let s=`<svg viewBox="0 0 ${w} ${h}" style="min-width:100%;width:${w}px;font-size:11px">`;
[...new Set([mx,mn,0])].forEach(v=>{s+=`<line x1="${pl}" x2="${w-4}" y1="${y(v)}" y2="${y(v)}" style="stroke:var(--bd)"/><text x="${pl-4}" y="${y(v)+4}" text-anchor="end" style="fill:var(--mut)">${f(v)}</text>`});
R.forEach(r=>{if(n>1)s+=`<polyline fill="none" stroke-linejoin="round" stroke-width="${r.w||2.5}" style="stroke:${r.c}" points="${r.v.map((v,i)=>x(i)+','+y(v)).join(' ')}"/>`;s+=r.v.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" style="fill:${r.dc?r.dc[i]:r.c}"/>`).join('')});
L.forEach((l,i)=>{const t=esc(l.length>14?l.slice(0,13)+'…':l);s+=rot?`<text transform="translate(${x(i)+4},${h-pb+14}) rotate(-35)" text-anchor="end" style="fill:var(--mut)">${t}</text>`:`<text x="${x(i)}" y="${h-pb+16}" text-anchor="middle" style="fill:var(--mut)">${t}</text>`});

function grH2(){const evs=gev().reverse(),sel=evs.filter(e=>GX[e.id]!==0),ok=m=>hr(m)>=GF&&hr(m)<=GT;let L,R;

function grH(){const evs=gev(),sel=evs.filter(e=>GX[e.id]!==0),L=[],B=[];
for(let h=GF;h<=GT;h++){L.push({l:String(h).padStart(2,'0')});B.push([])}
if(GM==='net'){const t=L.map(()=>0);sel.forEach(e=>e.moves.forEach(m=>{const h=new Date(m.ts).getHours();if(h>=GF&&h<=GT)t[h-GF]+=sv(m,'net')}));t.forEach((v,i)=>{if(v)B[i].push({v,c:v>0?'var(--gr)':'var(--out)'})})}
else sel.forEach(e=>{const col=ecol(e,evs.indexOf(e));e.moves.forEach(m=>{const v=sv(m,GM),h=new Date(m.ts).getHours();if(v&&h>=GF&&h<=GT){const b=B[h-GF],s=b.find(x=>x.e===e.id);s?s.v+=v:b.push({v,c:col,e:e.id})}})});
const T=B.reduce((a,b)=>a+b.reduce((x,s)=>x+s.v,0),0),ho=v=>[...Array(24)].map((_,h)=>`<option value="${h}" ${h===v?'selected':''}>${String(h).padStart(2,'0')}:00</option>`).join('');
return `<header><button class="ic" onclick="go('list')">‹</button><h1>Grafici · ${esc(gname())}</h1></header><main>${chips(GM,'setGM')}<div class="row" style="margin:10px 0"><small>Dalle</small><select style="width:auto;flex:1" onchange="GF=+this.value;if(GT<GF)GT=GF;render()">${ho(GF)}</select><small>alle</small><select style="width:auto;flex:1" onchange="GT=+this.value;if(GF>GT)GF=GT;render()">${ho(GT)}</select></div>${svgChart(L,B)}<div class="line big"><span>Totale selezione</span><b>${eur(T)}</b></div><h3>Eventi nel grafico</h3><div class="chips">${evs.length?evs.map((e,k)=>`<button class="chip ev ${GX[e.id]===0?'off':'on'}" style="--c:${ecol(e,k)}" onclick="tgE(${e.id})"><i style="background:${ecol(e,k)}"></i>${esc(e.name)}</button>`).join(''):'<small>Nessun evento in questa gestione.</small>'}</div><small>Tocca un evento per includerlo o escluderlo dal grafico. Ogni colore è un evento (il colore di sfondo scelto, altrimenti automatico).</small></main>`}
const COL=['#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#8e24aa','#d81b60','#6d4c41','#757575'];
const tint=(c,v)=>c?`background:color-mix(in srgb,${c} 22%,var(${v}))`:'';
function colorEv(i){modal(`<h2>Colore di sfondo</h2><div class="sw">${COL.map(c=>`<button style="background:${c}" onclick="setCol(${i},'${c}')"></button>`).join('')}<button class="none" onclick="setCol(${i},'')">Nessuno</button></div>`)}
function setCol(i,c){S.events.find(x=>x.id===i).color=c;save();closeM();render()}
function mvMenu(mid){const m=cur().moves.find(x=>x.id===mid);if(!m)return;modal(`<h2>${esc(m.d)}</h2><div class="stack" style="margin:0"><button class="btn" onclick="closeM();mov('${m.t}',${mid})">Modifica voce</button><button class="btn" onclick="rnMov(${mid})">Rinomina descrizione</button><button class="btn out" onclick="delMov(${mid})">Elimina</button></div>`)}
function rnMov(mid){const m=cur().moves.find(x=>x.id===mid);modal(`<h2>Rinomina voce</h2><input id="rm" value="${esc(m.d)}"><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn pri" onclick="doRnMov(${mid})">Salva</button></div>`);setTimeout(()=>$('#rm').select(),50)}
function doRnMov(mid){const n=$('#rm').value.trim();if(!n)return;cur().moves.find(x=>x.id===mid).d=n;save();closeM();render()}
let lpT,lpF=0,lpX=0,lpY=0;const lpStop=()=>clearTimeout(lpT);
document.addEventListener('pointerdown',ev=>{lpF=0;lpStop();const c=ev.target.closest('[data-lp]');if(!c)return;lpX=ev.clientX;lpY=ev.clientY;const [k,i]=c.dataset.lp.split(',');lpT=setTimeout(()=>{lpF=1;navigator.vibrate&&navigator.vibrate(25);k==='e'?evMenu(+i):mvMenu(+i)},500)});
document.addEventListener('pointermove',ev=>{if(Math.hypot(ev.clientX-lpX,ev.clientY-lpY)>10)lpStop()});
['pointerup','pointercancel'].forEach(n=>document.addEventListener(n,lpStop));
document.addEventListener('contextmenu',ev=>{if(ev.target.closest('[data-lp]'))ev.preventDefault()});
document.addEventListener('click',ev=>{if(lpF){lpF=0;ev.stopPropagation();ev.preventDefault()}},true);
function ren(i){closeM();const e=S.events.find(x=>x.id===i);modal(`<h2>Rinomina evento</h2><input id="rn" value="${esc(e.name)}"><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn pri" onclick="doRen(${i})">Salva</button></div>`);setTimeout(()=>$('#rn').select(),50)}
function doRen(i){const n=$('#rn').value.trim();if(!n)return;S.events.find(x=>x.id===i).name=n;save();closeM();render()}
function imp(i){modal(`<h2>Importa da Excel</h2><small>Prima riga = intestazioni, ordine libero:<br><b>Data</b> (gg/mm/aaaa, anche con ora) · <b>Tipo</b> (Entrata o Spesa) · <b>Categoria</b> · <b>Descrizione</b> · <b>Importo</b><br>Senza colonna Tipo, gli importi negativi sono spese. Le righe “Totale” sono ignorate e si legge solo il primo foglio. L’importazione aggiunge voci, non sostituisce: non importare due volte lo stesso file.</small><button class="btn" onclick="copyModel()">Copia un modello da incollare in Excel</button><input id="xf" type="file" accept=".xlsx,.xls,.csv"><div class="two"><button class="btn" onclick="closeM()">Annulla</button><button class="btn pri" onclick="doImp(${i})">Importa</button></div>`)}
const pdate=v=>{if(typeof v==='number')return new Date(Math.round((v-25569)*864e5)+new Date().getTimezoneOffset()*6e4);const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})(?:[, ]+(\d{1,2}):(\d{2})(?::(\d{2}))?)?/.exec(String(v||''));if(m)return new Date(+m[3],m[2]-1,+m[1],+(m[4]||12),+(m[5]||0),+(m[6]||0));const d=new Date(v);return isNaN(d)?new Date():d};
async function doImp(i){const fl=$('#xf').files[0];if(!fl)return toast('Scegli un file');if(typeof XLSX==='undefined')return toast('Libreria Excel non caricata: riprova con la connessione attiva');
try{const wb=XLSX.read(await fl.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''}),e=S.events.find(x=>x.id===i);
const h={d:0,t:1,c:2,s:3,a:4};let st=0;const f0=rows[0]||[];
if(f0.some(x=>typeof x==='string'&&/importo|amount|descr|tipo|data/i.test(x))){st=1;f0.forEach((x,k)=>{x=String(x).toLowerCase();if(/data|date/.test(x))h.d=k;else if(/tipo|type/.test(x))h.t=k;else if(/categ/.test(x))h.c=k;else if(/descr/.test(x))h.s=k;else if(/importo|amount|valore/.test(x))h.a=k})}
let n=0;for(const r of rows.slice(st)){if(/^(totale|ricavo)/i.test(String(r[h.d]??'')))continue;
const a=typeof r[h.a]==='number'?r[h.a]:calc(String(r[h.a]??'').replace(/[€\s]/g,''));if(a===null||!a)continue;
const tp=String(r[h.t]??'').toLowerCase().trim(),t=/^(entr|ric|in|\+)/.test(tp)?'in':/^(spes|pag|out|usc|-|−)/.test(tp)?'out':a<0?'out':'in';
const cn=String(r[h.c]??'').trim();let c=null;if(cn){let k=S.cats.find(x=>x.name.toLowerCase()===cn.toLowerCase());if(!k){k={id:id(),name:cn};S.cats.push(k)}c=k.id}
e.moves.push({id:id(),t,a:Math.round(Math.abs(a)*100)/100,d:String(r[h.s]??'').trim()||(t==='in'?'Ricevuto':'Pagato'),c,ts:pdate(r[h.d]).toISOString()});n++}
save();closeM();render();toast(n+' voci importate')}catch(x){toast('File non leggibile')}}

function evH(){const e=cur(),dis=e.closed?'disabled':'';
const ms=[...e.moves].sort((a,b)=>b.ts.localeCompare(a.ts)||b.id-a.id);let b=0;const run={};
[...e.moves].sort((a,b)=>a.ts.localeCompare(b.ts)||a.id-b.id).forEach(m=>{b+=m.t==='in'?m.a:-m.a;run[m.id]=b});
const i=tot(e,'in'),o=tot(e,'out'),r=i-o,cell=(l,v,c)=>`<div><small>${l}</small><b style="color:var(--${c});font-weight:${c==='gr'?800:600}">${eur(v)}</b></div>`;
return `<header><button class="ic" onclick="go('list')">‹</button><h1 onclick="ren(${e.id})">${esc(e.name)} ✎</h1><button class="ic" onclick="go('sum')">📊</button><button class="ic" onclick="toggle()">${e.closed?'🔒':'🔓'}</button></header><main style="${tint(e.color,'--bg')}">${ms.length?ms.map(m=>`<div class="card" ${e.closed?'':`data-lp="m,${m.id}" onclick="mov('${m.t}',${m.id})"`}><div><b>${esc(m.d)}</b><small>${catName(m.c)?esc(catName(m.c))+' · ':''}${fmt(m.ts)}</small></div>${m.f?`<button class="ic" onclick="event.stopPropagation();vp(${m.id})">📷</button>`:''}<div class="r"><b style="color:var(--${m.t})">${eur(m.a)}</b><small>Bilancio ${eur(run[m.id])}</small></div></div>`).join(''):'<p class="empty">Nessun movimento.<br>Usa i pulsanti in basso.</p>'}</main><footer><div class="two"><button class="btn in" ${dis} onclick="mov('in')">Hai Ricevuto</button><button class="btn out" ${dis} onclick="mov('out')">Hai Pagato</button></div><div class="tots">${cell('Totale Ricevuto',i,'yel')}${cell('Totale Pagato',o,'out')}${cell('Ricavo',r,r>=0?'gr':'out')}</div></footer>`}
function toggle(){const e=cur();e.closed=!e.closed;save();view.n=e.closed?'sum':'ev';render()}

const catOpts=s=>`<option value="">Nessuna categoria</option>`+S.cats.map(c=>`<option value="${c.id}" ${c.id===s?'selected':''}>${esc(c.name)}</option>`).join('');
function mov(t,mid){const e=cur(),m=mid?e.moves.find(x=>x.id===mid):null;
modal(`<div class="bar"><button class="btn" onclick="closeM()">Annulla</button><h2 id="pv" data-t="${m?'Modifica voce':t==='in'?'Hai ricevuto':'Hai pagato'}" style="color:var(--${t})">${m?'Modifica voce':t==='in'?'Hai ricevuto':'Hai pagato'}</h2><button class="btn ${t}" onclick="saveMov('${t}',${mid||0})">Salva</button></div><input id="a" inputmode="decimal" autocomplete="off" placeholder="Valore € (anche un calcolo)" value="${m?String(m.a).replace('.',','):''}" oninput="pv()"><div class="ops">${['+','−','×','÷','(',')'].map(o=>`<button onclick="ins('${o}')">${o}</button>`).join('')}<button onclick="bk()">⌫</button><button class="eq" onclick="eq()">=</button></div><button class="btn" onclick="$('#dt').hidden=!$('#dt').hidden">🕒 Data e ora</button><input id="dt" type="datetime-local" step="1" hidden value="${loc(m?m.ts:new Date())}"><input id="d" placeholder="Descrizione" value="${m?esc(m.d):''}"><div class="row"><select id="c">${catOpts(m&&m.c)}</select><button class="ic" style="color:var(--tx)" onclick="$('#nc').hidden=false;$('#ncn').focus()">＋</button></div><div class="row" id="nc" hidden><input id="ncn" placeholder="Nome nuova categoria"><button class="btn pri" onclick="saveCat()">Aggiungi</button></div><div class="row"><label class="btn lb">📷 Scatta foto<input type="file" accept="image/*" capture="environment" onmousedown="event.preventDefault()" onchange="pick(this)"></label><label class="btn lb">🖼 Galleria<input type="file" accept="image/*" onmousedown="event.preventDefault()" onchange="pick(this)"></label></div><div id="phw" class="row"></div>${m?`<button class="btn out" onclick="delMov(${m.id})">Elimina</button>`:''}`);ph=undefined;if(m&&m.f)pget(m.id).then(v=>{if(v&&ph===undefined){ph=v;showPh()}});setTimeout(()=>$('#a').focus(),50)}
function pv(){const t=$('#a').value,el=$('#pv');if(!/[+\-−×x*÷\/:()]/.test(t)){el.textContent=el.dataset.t;el.className='';return}const v=calc(t);el.textContent=v===null?'Calcolo non valido':'= '+eur(v);el.className=v===null?'bad':''}
function ins(s){const a=$('#a'),p=a.selectionStart??a.value.length,q=a.selectionEnd??p;a.setRangeText(s,p,q,'end');a.focus();pv()}
function bk(){const a=$('#a');let p=a.selectionStart,q=a.selectionEnd;if(p===q){if(!p)return;p--}a.setRangeText('',p,q,'end');a.focus();pv()}
function eq(){const v=calc($('#a').value);if(v!==null){$('#a').value=String(Math.round(v*100)/100).replace('.',',');pv()}}
function saveCat(){const n=$('#ncn').value.trim();if(!n)return;let c=S.cats.find(x=>x.name.toLowerCase()===n.toLowerCase());if(!c){c={id:id(),name:n};S.cats.push(c);save()}$('#c').innerHTML=catOpts(c.id);$('#nc').hidden=true;$('#ncn').value=''}
function saveMov(t,mid){const v=calc($('#a').value);if(v===null||v<=0){$('#pv').textContent='Inserisci un importo valido';$('#pv').className='bad';return}
const e=cur(),a=Math.round(v*100)/100,d=$('#d').value.trim()||(t==='in'?'Ricevuto':'Pagato'),c=+$('#c').value||null;
const dt=$('#dt'),mm=mid?e.moves.find(x=>x.id===mid):null,ts=!dt.hidden&&dt.value?new Date(dt.value).toISOString():mm?mm.ts:new Date().toISOString();
let mv=mm;if(mm)Object.assign(mm,{a,d,c,ts});else{mv={id:id(),t,a,d,c,ts};e.moves.push(mv)}
if(ph)pput(mv.id,ph).then(k=>{if(k===undefined)toast('Foto non salvata');else{mv.f=1;save();render()}});
else if(ph===''&&mv.f){delete mv.f;pdel(mv.id)}
save();closeM();render()}
function delMov(mid){const e=cur(),i=e.moves.findIndex(x=>x.id===mid),m=e.moves.splice(i,1)[0];save();closeM();render();toast('Voce eliminata',()=>{e.moves.push(m);save();render()})}

function sumH(){const e=cur(),i=tot(e,'in'),o=tot(e,'out'),r=i-o;
const by=t=>{const m={};e.moves.filter(x=>x.t===t).forEach(x=>{const k=catName(x.c)||'Senza categoria';m[k]=(m[k]||0)+x.a});return Object.entries(m).map(([k,v])=>`<div class="line"><span>${esc(k)}</span><b style="color:var(--${t})">${eur(v)}</b></div>`).join('')};
const bi=by('in'),bo=by('out');
return `<header><button class="ic" onclick="go('ev')">‹</button><h1>Riepilogo</h1></header><main><h2>${esc(e.name)}</h2><small>Evento del ${fdate(e.date)}${e.closed?' · chiuso':''}</small><div class="line big" style="margin-top:12px"><span>Totale entrate</span><b style="color:var(--in)">${eur(i)}</b></div><div class="line big"><span>Totale spese</span><b style="color:var(--out)">${eur(o)}</b></div><div class="ricavo" style="color:var(--${r>=0?'in':'out'})"><small style="color:inherit">RICAVO</small><b>${eur(r)}</b><small style="color:inherit">${r>=0?'In attivo':'In perdita'}</small></div>${bi?`<h3>Entrate per categoria</h3>${bi}`:''}${bo?`<h3>Spese per categoria</h3>${bo}`:''}<div class="stack"><button class="btn pri" onclick="shareTxt()">Condividi riepilogo</button><button class="btn" onclick="xlsxEv()">Esporta in Excel (.xlsx)</button><button class="btn" onclick="print()">Stampa / salva PDF</button></div></main>`}
const sorted=e=>[...e.moves].sort((a,b)=>a.ts.localeCompare(b.ts)||a.id-b.id);
async function shareTxt(){const e=cur(),i=tot(e,'in'),o=tot(e,'out');
const t=`${e.name} — ${fdate(e.date)}\nEntrate: ${eur(i)}\nSpese: ${eur(o)}\nRICAVO: ${eur(i-o)}\n\n`+sorted(e).map(m=>`${fmt(m.ts)}  ${m.t==='in'?'+':'−'}${eur(m.a)}  ${m.d}${catName(m.c)?' ['+catName(m.c)+']':''}`).join('\n');
try{if(navigator.share){await navigator.share({text:t});return}}catch(x){if(x.name==='AbortError')return}box('Riepilogo',t)}
async function copyTsv(){const e=cur(),n=v=>String(v).replace('.',','),i=tot(e,'in'),o=tot(e,'out');
const t=['Data e ora\tTipo\tCategoria\tDescrizione\tImporto',...sorted(e).map(m=>[fmt(m.ts),m.t==='in'?'Entrata':'Spesa',catName(m.c),m.d,n(m.a)].join('\t')),`TOTALE ENTRATE\t\t\t\t${n(i)}`,`TOTALE SPESE\t\t\t\t${n(o)}`,`RICAVO\t\t\t\t${n(Math.round((i-o)*100)/100)}`].join('\n');
if(await copy(t))toast('Copiato: incollalo in Excel o Fogli');else box('Copia per Excel',t)}

function catH(){return `<header><button class="ic" onclick="go('list')">‹</button><h1>Categorie</h1></header><main>${S.cats.length?S.cats.map(c=>`<div class="card"><input class="plain" value="${esc(c.name)}" onchange="renCat(${c.id},this.value)"><button class="ic" onclick="sure('Eliminare la categoria “${esc(c.name).replace(/'/g,'')}”? Le voci restano, senza categoria.',()=>delCat(${c.id}))">🗑</button></div>`).join(''):'<p class="empty">Nessuna categoria.<br>Aggiungine una (es. Benzina, Pedaggio, Hotel).</p>'}</main><footer><div class="two"><input id="nn" placeholder="Nuova categoria"><button class="btn pri" onclick="addC()">Aggiungi</button></div></footer>`}
function addC(){const n=$('#nn').value.trim();if(!n)return;if(S.cats.some(c=>c.name.toLowerCase()===n.toLowerCase())){toast('Esiste già');return}S.cats.push({id:id(),name:n});save();render()}
function renCat(i,v){const n=v.trim();if(!n||S.cats.some(c=>c.id!==i&&c.name.toLowerCase()===n.toLowerCase())){render();toast('Nome non valido o già esistente');return}S.cats.find(c=>c.id===i).name=n;save()}
function delCat(i){S.cats=S.cats.filter(c=>c.id!==i);S.events.forEach(e=>e.moves.forEach(m=>{if(m.c===i)m.c=null}));save();render()}
start();
</script><script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))</script>
</body></html>
